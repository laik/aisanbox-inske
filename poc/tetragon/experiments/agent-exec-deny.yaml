# 实测得到的关键结论(写进 POC 结论):
# bprm_check_security 上的路径匹配针对**解析后的真实可执行文件**。
# Alpine/BusyBox 镜像里 /bin/sleep -> /bin/busybox，
# 所以按 "/bin/sleep" 写策略永远不会命中；必须按 /bin/busybox 写。
# 这类"镜像形态决定策略写法"的坑，是多租户安全平台必须文档化的规范。
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: acme-busybox-exec-denial
spec:
  podSelector:
    matchLabels:
      projectcapsule.dev/tenant: acme
  lsmhooks:
    - hook: "bprm_check_security"
      args:
        - {index: 0, type: linux_binprm}
      selectors:
        - matchArgs:
            - {index: 0, operator: Prefix, values: ["/bin/busybox"]}
          matchActions:
            - {action: Override, argError: -1}
