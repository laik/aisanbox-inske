# 平台侧预置的 Runtime Namespace（operator 模式：OpenShell 不建、不删）。
# a/b = 正例（打标签 + 装 openshell-workspace chart）
# c   = 负例：打标签但**不装** chart → 验证 workspace Role 是 Secret 权限的唯一来源
# d   = 负例：装了 chart 但**不打标签** → 验证发现机制只看标签
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-a-runtime
  labels:
    openshell.ai/workspace: "true"
    platform.io/tenant: tenant-a
---
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-b-runtime
  labels:
    openshell.ai/workspace: "true"
    platform.io/tenant: tenant-b
---
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-c-runtime
  labels:
    openshell.ai/workspace: "true"
    platform.io/tenant: tenant-c
---
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-d-runtime
  labels:
    platform.io/tenant: tenant-d
