# 数据 Agent 的三类挂载源 + 渲染器。__DB_IP__ 由 demo.sh 替换。
#
# 配额注意（实测 capsule-tenant-a-0）：PVC 上限 9，vault demo 已占 8 ——
# 所以密钥渲染**复用 agent-secrets-pvc**（同租户密钥盘，多写两个文件），
# 只新建 da-output 一个 PVC。渲染 Job 与 vault demo 的 vault-render 互不
# 冲突（写不同文件）。
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: da-config
  namespace: tenant-a-runtime
  labels:
    openshell.ai/sandbox-attachable: "true"
    example.com/workspace: poc-shared
data:
  # 临时配置：演示中 kubectl patch 改 ROW_LIMIT，kubelet ~60s 内同步进
  # 运行中的 sandbox（目录挂载，非 subPath），agent 每次运行重读。
  config.env: |
    DB_HOST=__DB_IP__
    DB_PORT=5432
    DB_NAME=appdb
    TARGET_TABLE=sales
    ROW_LIMIT=5
---
apiVersion: v1
kind: Secret
metadata:
  name: da-report-token
  namespace: tenant-a-runtime
  labels:
    openshell.ai/sandbox-attachable: "true"
    example.com/workspace: poc-shared
type: Opaque
stringData:
  report-token: "demo-static-report-token-abc123"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: da-output
  namespace: tenant-a-runtime
  labels:
    openshell.ai/sandbox-attachable: "true"
    example.com/workspace: poc-shared
spec:
  accessModes: [ReadWriteMany]
  storageClassName: rwx-shared
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: da-render
  namespace: tenant-a-runtime
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: vault-renderer   # vault demo 已建（15-vault-renderer-role.sh）
      restartPolicy: Never
      containers:
        - name: render
          image: hashicorp/vault:2.0.4
          command:
            - sh
            - -c
            - |
              set -e
              export VAULT_ADDR=http://vault.vault.svc:8200
              T=$(vault write -field=token auth/kubernetes/login \
                    role=tenant-a-renderer \
                    jwt="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)")
              export VAULT_TOKEN="$T"
              rm -f /secrets-out/db-admin-username /secrets-out/db-admin-password
              vault kv get -field=username secret/tenant-a/db-admin > /secrets-out/db-admin-username
              vault kv get -field=password secret/tenant-a/db-admin > /secrets-out/db-admin-password
              chmod 0444 /secrets-out/db-admin-username /secrets-out/db-admin-password
              echo "rendered db-admin:"; ls -la /secrets-out/
          volumeMounts:
            - name: secrets-out
              mountPath: /secrets-out
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
      volumes:
        - name: secrets-out
          persistentVolumeClaim:
            claimName: agent-secrets-pvc