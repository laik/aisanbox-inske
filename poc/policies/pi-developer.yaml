# POC2 §5.3: "Developer 的策略允许写入 /data/workspace"。
#
# 为什么必须显式写(实测): OpenShell 的默认文件系统基线只有
#   read_only:  /bin /usr /lib /proc /dev/urandom /etc /var/log
#   read_write: /tmp /dev/null
# —— **不含 /data**。所以在沙箱里 `ls /data/workspace` 得到 `Permission denied`，
# 而**同一个 PVC 挂进一个普通 Pod** 时 uid 10001 读写都正常(实测 UID_WRITE_OK)。
# 也就是说: 不是存储/权限问题，是策略边界。这个坑在 /opt 上先出现过一次(pi 的
# agent 目录)，换到 /data 又出现一次 —— 根因是"平台默认基线覆盖哪些路径"，
# 不是某个挂载或某个镜像的 bug。
#
# 因此这里显式把挂载点加进 read_write。**不要**为了省事改成 read_write: [/] ——
# 那等于把整个根可写，`/.openshell`、`/run` 这些 OpenShell 自己用的路径也一起放开了
# (POC2 §5.3 特别提了不要覆盖它们)。
version: 1
filesystem_policy:
  include_workdir: true
  read_only:
    - /bin
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /etc
    - /var/log
  read_write:
    - /tmp
    - /dev/null
    - /data/workspace
