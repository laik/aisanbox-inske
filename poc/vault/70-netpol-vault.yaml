# 实测坑（2026-11-18）：openshell-sandbox-workloads NetPol 声明了 Egress
# 但没有任何 egress 规则 → workload Pod 默认全拒（含 DNS）。
# vault-agent-init 在 workload Pod 里跑，必须能解析并访问 Vault，
# 否则注入卡在 "lookup vault.vault.svc: i/o timeout"。
#
# NetworkPolicy 是叠加白名单：本策略只开两条受控出口，不放松其余边界。
# 安全说明：NetPol 粒度是 Pod 不是容器，agent 进程本身也能到 vault:8200。
# 它持有的 SA token 只能登录成 tenant-a-agent（role 绑 SA+ns），读到的
# 就是渲染文件暴露的同一条 KV 子树 —— 不扩大权限面，但审计上要记一笔。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vault-injection
  namespace: tenant-a-runtime
spec:
  podSelector:
    matchLabels:
      openshell.ai/boundary-role: workload
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vault
      ports:
        - port: 8200
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP