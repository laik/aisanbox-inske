# 基线（policy get --base 实测）+ /vault/secrets 只读。
# 不加这条，注入成功也会在容器内得到与 Unix 权限无关的 Permission denied
# （POC2-CONCLUSIONS §3.1 的同款坑）。/etc 已在基线里，ConfigMap 挂
# /etc/agent-config 不需要改策略。
version: 1
filesystem_policy:
  include_workdir: true
  read_only:
    - /bin
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /etc
    - /var/log
    - /vault/secrets
  read_write:
    - /tmp
    - /dev/null
landlock:
  compatibility: best_effort