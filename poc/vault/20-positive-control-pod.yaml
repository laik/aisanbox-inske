# 正向对照：普通 Pod（不经过 OpenShell），证明 Vault+injector 本身工作。
# 刻意复刻 OpenShell workload Pod 的三个关键形态（实测）：
#   - SA=os-a-openshell-sandbox（gateway 级 SA，所有 sandbox 共用）
#   - automountServiceAccountToken=true（普通 Pod 允许；workload 不允许，
#     见 100-renderer.yaml 的产品边界记录）
# 对照证明 Vault+injector 本身健康；sandbox 侧走边界外渲染（100/110）。
apiVersion: v1
kind: Pod
metadata:
  name: vault-inject-control
  namespace: tenant-a-runtime
  annotations:
    vault.hashicorp.com/agent-inject: "true"
    vault.hashicorp.com/role: "tenant-a-agent"
    vault.hashicorp.com/agent-pre-populate-only: "true"   # 只跑 init，无常驻 sidecar
    vault.hashicorp.com/agent-inject-secret-database-url: "secret/data/tenant-a/database"
    vault.hashicorp.com/agent-inject-template-database-url: |
      {{- with secret "secret/data/tenant-a/database" -}}
      {{ .Data.data.url }}
      {{- end -}}
    vault.hashicorp.com/agent-inject-secret-api-token: "secret/data/tenant-a/api"
    vault.hashicorp.com/agent-inject-template-api-token: |
      {{- with secret "secret/data/tenant-a/api" -}}
      {{ .Data.data.token }}
      {{- end -}}
spec:
  serviceAccountName: os-a-openshell-sandbox
  automountServiceAccountToken: true
  restartPolicy: Never
  containers:
    - name: agent   # 必须叫 agent：Kyverno SSA 按 name 合并进这个容器
      image: alpine:latest
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests: { cpu: 50m, memory: 32Mi }
        limits:   { cpu: 100m, memory: 64Mi }