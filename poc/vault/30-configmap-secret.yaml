# E1/E2 用：ConfigMap 与静态 Secret（合成演示值）。
# 标签按 os-a gateway 的 resourceAdmission.requiredLabels 实测值打：
#   example.com/workspace=${workspace} + openshell.ai/sandbox-attachable=true
# （见 helm -n tenant-a-gateway get values os-a）
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config
  namespace: tenant-a-runtime
  labels:
    openshell.ai/sandbox-attachable: "true"
    example.com/workspace: poc-shared
data:
  app.yaml: |
    environment: poc
    log_level: info
    tenant: tenant-a
---
apiVersion: v1
kind: Secret
metadata:
  name: agent-secrets
  namespace: tenant-a-runtime
  labels:
    openshell.ai/sandbox-attachable: "true"
    example.com/workspace: poc-shared
type: Opaque
stringData:
  database-url: "postgres://static-copy:DEMO-ONLY@db.tenant-a.svc:5432/app"