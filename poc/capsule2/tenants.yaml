# POC-02 —— 两个租户。
# 注意(实测): additionalMetadata 会打到该租户**所有** namespace 上，包括 gateway ns。
# 所以 POC2 §4.1 里的 platform.example.com/runtime 不能靠 additionalMetadata 注入 ——
# 它必须由平台只打在 runtime ns 上(见 04-capsule.sh 末尾)。这样 Gatekeeper 才能按
# "namespace 的角色"划作用域。
# 实测偏离(必须写下来): POC2 里的 Tenant 只写了 namespaceOptions.quota + forceTenantPrefix,
# 这样 alice 会拿到 "You do not have any Tenant assigned" —— 因为 Capsule 0.15 的归属判定
# 看的是 spec.owners。所以这里补 owners，并按 POC2 §3.5 的要求补上资源 requests/limits 的
# 合同（LimitRange 默认值 + 配额），让"Runtime 工作负载必须有 requests/limits"可验证。
apiVersion: capsule.clastix.io/v1beta2
kind: Tenant
metadata:
  name: tenant-a
  labels: {app.kubernetes.io/part-of: aisanbox-poc2}
spec:
  owners:
    - {kind: Group, name: tenant-a-owners}
  namespaceOptions:
    quota: 5
    additionalMetadata:
      labels:
        platform.example.com/tenant: tenant-a
  forceTenantPrefix: true
  # ── POC3 补上的**平台级租户网络隔离**(2026-11-10 实测)。这修正了 POC2 §5.4 里
    #   "跨租户网络隔离不是平台能力"那条 —— 当时 Tenant 里**没有**这个字段，
    #   所以跨租户的两个普通 Pod 是 REACHED。补上之后同一条测试变成 BLOCKED(见 phases/14 的 2b 节)。
    #
    # ⚠ 三条实测约束(都是硬结论，不是风格):
    #  1) 只支持 `items`。写 `generate:` 会被 strict decoding 直接拒掉
    #     (unknown field "generate") —— 0.15.2 没有这个字段。
    #  2) 整个字段在 0.15.2 已**标为 deprecated**，webhook 会提示改用 TenantReplications。
    #     现在能用，但升级前要按新方式重写。
    #  3) **可加性**: NetworkPolicy 的语义是并集。租户自己建一条 Ingress 策略就能把
    #     这条边界**放宽**(实测: 加 p3-reopen 之后 a->b 从 BLOCKED 变 REACHED，撤掉又恢复)。
    #     要"画了就不能改"，得用 spec.rules.enforce.policies 或 Antrea ClusterNetworkPolicy。
    #
    # 已存在的 namespace **不会**被跳过: 控制器会 reconcile 并在每个租户 ns 里
    # 生成/更新 `capsule-tenant-<t>-0`(ownerRef 指向 Tenant，带
    # capsule.clastix.io/network-policy 标签)，新建的 tenant-a-* ns 自动继承。
    # 租户 owner 删不掉也改不了这些被管的策略 —— 边界是平台画的。
  networkPolicies:
    items:
      - podSelector: {}
        policyTypes: ["Ingress"]
        ingress:
          - from:
              - namespaceSelector:
                  matchLabels:
                    capsule.clastix.io/tenant: tenant-a   # 只允许同租户的 ns 进来
  # 配额要按**一个沙箱的真实开销**来算，不是按"agent 容器"。
  # 实测(第二轮，第一次跑 3 沙箱场景时): 第 3 个沙箱起不来，CLI 只说
  #   create sandbox failed: timed out waiting for gated workload Pod poc-shared--git-test
  # 真正的原因在 **agent-sandbox 控制器**的日志里:
  #   pods "poc-shared--git-test" is forbidden: exceeded quota: capsule-tenant-a-0,
  #   requested: limits.memory=1Gi, used: limits.memory=2Gi, limited: limits.memory=2560Mi
  # 两条结论要写进报告:
  #  (1) Capsule 的配额**确实管住了** OpenShell 创建的沙箱(这正是 POC-02 要的证据)，
  #      而且按 §3.4 的 `scope: Tenant` 是**跨该租户所有 namespace 聚合**的 ——
  #      gateway pod + 每个沙箱的 agent pod 都算在内。
  #  (2) 但报错路径很长: CLI 说 timeout，根因在另一个产品的日志里。生产上要把
  #      quota 拒绝做成可观测的一等事件(§12.2 的 Kubernetes Events/Audit 那一行)。
  # 一个沙箱的实测开销(agent 500m/1Gi + 它自己的 workspace PVC 1Gi；supervisor 不额外计):
  #   ≈ 500m CPU / 1Gi limits / 1Gi storage。gateway pod 另占 300m/512Mi。
  # 所以 3 个沙箱(dev + 2 reviewer)实际需要:
  #   limits.cpu   ≥ 300m + 3*500m = 1800m
  #   limits.memory≥ 512Mi + 3*1Gi = 3584Mi
  #
  # ===== 2026-11-09 补: 三个实测事实，都会让"按上面算的配额"仍然不够 =====
  # (A) **每个沙箱会创建两个 Service**(`os-boundary-<pair>` + `os-supervisor-<pair>`)。
  #     第 5 个沙箱被这条挡住，而且这次报错直接进 CLI(不用翻别的产品日志):
  #       services "os-boundary-8b80a1f2-…" is forbidden: exceeded quota: capsule-tenant-a-0,
  #       requested: count/services=1, used: count/services=8, limited: count/services=8
  #     → **count/services ≥ gateway 自己的 svc + 2×沙箱数**。
  #     而且 phase=Completed 的沙箱**仍然占着**这两个 Service 与 PVC —— "命令跑完了"不等于
  #     资源释放，必须真的 `sandbox delete`(见 POC2-CONCLUSIONS 的"沙箱生命周期")。
  # (B) **先撞到的其实是 requests.memory，不是 limits.memory**。加大 services 之后第 3 个
  #     Pi 沙箱仍然起不来，CLI 报错和上次一字不差:
  #       create sandbox failed: timed out waiting for gated workload Pod poc-shared--pi-review-2
  #     根因还是只在 agent-sandbox 控制器日志里，但换了维度:
  #       pods "poc-shared--pi-review-2" is forbidden: exceeded quota: capsule-tenant-a-0,
  #       requested: requests.memory=1Gi, used: requests.memory=2432Mi, limited: requests.memory=2816Mi
  #     实测一个 **Pi 沙箱**的 requests 开销: agent 1Gi(`--memory` 的值同时成了 requests)
  #     + 它自己的 supervisor Pod 128mi(LimitRange default) ≈ **1.15Gi / 个**。
  #     两个沙箱 = 2304Mi，而 runtime ns 只分到 2816Mi → 第 3 个必被挡。
  #     → **requests.* 也要按沙箱数算**，不能只算 limits.*。
  # (C) Capsule 会把 tenant 级配额**按 namespace 分摊**(Tenant 写 10 → runtime 8 / gateway 2)。
  #     所以验证时要读**实际生效**的 ResourceQuota:
  #       kubectl get resourcequota capsule-tenant-a-0 -n <ns> -o jsonpath={.spec.hard}
  #     而不是读 Tenant CR 里的数。
  # 按 3 个 Pi 沙箱 + 排障用的临时 alpine 沙箱重算(services ≥ 2 + 6*2 = 14；
  # requests.memory ≥ 3*1.2Gi + 余量; limits.memory ≥ 512Mi + 3*1Gi + 余量):
  resourceQuotas:
    items:
      - hard:
          requests.cpu: "4"
          requests.memory: 6Gi
          limits.cpu: "6"
          limits.memory: 8Gi
          persistentvolumeclaims: "10"
          count/pods: "40"
          count/services: "14"
          requests.storage: 20Gi
  limitRanges:
    items:
      - limits:
          - type: Container
            default: {cpu: 300m, memory: 512Mi}
            defaultRequest: {cpu: 100m, memory: 128Mi}
            max: {cpu: "1", memory: 1Gi}
            min: {cpu: 10m, memory: 16Mi}
---
apiVersion: capsule.clastix.io/v1beta2
kind: Tenant
metadata:
  name: tenant-b
  labels: {app.kubernetes.io/part-of: aisanbox-poc2}
spec:
  owners:
    - {kind: Group, name: tenant-b-owners}
  namespaceOptions:
    quota: 5
    additionalMetadata:
      labels:
        platform.example.com/tenant: tenant-b
  forceTenantPrefix: true
  # ── POC3 补上的**平台级租户网络隔离**(2026-11-10 实测)。这修正了 POC2 §5.4 里
    #   "跨租户网络隔离不是平台能力"那条 —— 当时 Tenant 里**没有**这个字段，
    #   所以跨租户的两个普通 Pod 是 REACHED。补上之后同一条测试变成 BLOCKED(见 phases/14 的 2b 节)。
    #
    # ⚠ 三条实测约束(都是硬结论，不是风格):
    #  1) 只支持 `items`。写 `generate:` 会被 strict decoding 直接拒掉
    #     (unknown field "generate") —— 0.15.2 没有这个字段。
    #  2) 整个字段在 0.15.2 已**标为 deprecated**，webhook 会提示改用 TenantReplications。
    #     现在能用，但升级前要按新方式重写。
    #  3) **可加性**: NetworkPolicy 的语义是并集。租户自己建一条 Ingress 策略就能把
    #     这条边界**放宽**(实测: 加 p3-reopen 之后 a->b 从 BLOCKED 变 REACHED，撤掉又恢复)。
    #     要"画了就不能改"，得用 spec.rules.enforce.policies 或 Antrea ClusterNetworkPolicy。
    #
    # 已存在的 namespace **不会**被跳过: 控制器会 reconcile 并在每个租户 ns 里
    # 生成/更新 `capsule-tenant-<t>-0`(ownerRef 指向 Tenant，带
    # capsule.clastix.io/network-policy 标签)，新建的 tenant-a-* ns 自动继承。
    # 租户 owner 删不掉也改不了这些被管的策略 —— 边界是平台画的。
  networkPolicies:
    items:
      - podSelector: {}
        policyTypes: ["Ingress"]
        ingress:
          - from:
              - namespaceSelector:
                  matchLabels:
                    capsule.clastix.io/tenant: tenant-b   # 只允许同租户的 ns 进来
  resourceQuotas:
    items:
      - hard:
          requests.cpu: "1"
          requests.memory: 1Gi
          limits.cpu: "1"
          limits.memory: 1Gi
          persistentvolumeclaims: "3"
          count/pods: "10"
  # 实测发现(重要, 值得进报告): 一旦 ResourceQuota 里出现 limits.cpu / limits.memory，
  # **每个** Pod 都必须能被算出这些值。OpenShell Gateway chart 的 certgen hook Job 不写
  # resources，于是被配额挡住:
  #   failed quota: capsule-tenant-b-0: must specify limits.cpu for: certgen
  # 把它补全的正是 LimitRange 的 default —— 所以"有 quota 就必须同时有 LimitRange default"，
  # 否则平台自己的安装在租户 namespace 里跑不起来。tenant-a 一开始能过就是因为它有 LimitRange。
  limitRanges:
    items:
      - limits:
          - type: Container
            default: {cpu: 200m, memory: 256Mi}
            defaultRequest: {cpu: 50m, memory: 64Mi}
            max: {cpu: "1", memory: 1Gi}
            min: {cpu: 10m, memory: 16Mi}
