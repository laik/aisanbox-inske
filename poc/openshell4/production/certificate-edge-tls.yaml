# 边缘证书：cert-manager 签发，被 grpcRoute.gateway.listener.tls.certificateRefs 引用。
# 必须与 values-gateway-prod.yaml 里的 hostnames 一致。
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openshell-edge-tls
  namespace: openshell
spec:
  secretName: openshell-edge-tls
  duration: 2160h            # 90d
  renewBefore: 360h          # 提前 15d 续期
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
    - "openshell.example.com"
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod   # 或你的私有 CA ClusterIssuer
