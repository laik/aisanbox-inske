# =============================================================================
# 生产 Secret 交付方式（External Secrets Operator 示例）
#
# 两个 Secret 都**不要**由 Helm 生成、不要进 Git：
#   openshell-db    key: uri                 —— PG 连接串（带 sslmode）
#   openshell-kek   key: key-encryption-key  —— base64(32 random bytes)
#
# KEK 一次性生成并托管（Vault / AWS Secrets Manager / KMS）：
#   openssl rand -base64 32
# ⚠ KEK 必须备份（离线托管 + 权限分离）。PG 备份里只有密文凭据，KEK 丢了
#   等于所有 provider credential 永久不可解；换 KEK 也没有重加密工具。
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: openshell-db
  namespace: openshell
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: openshell-db          # chart 通过 server.externalDbSecret 引用这个名字
    creationPolicy: Owner
  data:
    - secretKey: uri
      remoteRef:
        key: openshell/prod/postgres
        property: uri
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: openshell-kek
  namespace: openshell
spec:
  refreshInterval: 24h          # KEK 不是轮换对象；refresh 只是防漂移
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: openshell-kek         # chart 通过 credentialStorage.existingSecret 引用
    creationPolicy: Owner
  data:
    - secretKey: key-encryption-key
      remoteRef:
        key: openshell/prod/kek
        property: key-encryption-key
