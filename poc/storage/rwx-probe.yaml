# Phase 2b 用: 证明 rwx-shared 真的是"同一份数据被两个 Pod 同时读写"，
# 而不是"PVC 上写了 RWX 就算支持"。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rwx-probe
  namespace: tenant-a-runtime
spec:
  accessModes: [ReadWriteMany]
  storageClassName: rwx-shared
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: rwx-a
  namespace: tenant-a-runtime
spec:
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector: {matchLabels: {app: rwx-b}}
  containers:
    - name: c
      image: alpine:latest
      command: ["sleep", "900"]
      resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 50m, memory: 32Mi}}
      volumeMounts: [{name: v, mountPath: /data}]
  volumes: [{name: v, persistentVolumeClaim: {claimName: rwx-probe}}]
---
apiVersion: v1
kind: Pod
metadata:
  name: rwx-b
  namespace: tenant-a-runtime
  labels: {app: rwx-b}
spec:
  containers:
    - name: c
      image: alpine:latest
      command: ["sleep", "900"]
      resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 50m, memory: 32Mi}}
      volumeMounts: [{name: v, mountPath: /data}]
  volumes: [{name: v, persistentVolumeClaim: {claimName: rwx-probe}}]
